<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'todo/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'todo/css/dashboard.css' %}">
</head>
<body>
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <a href="{% url 'todo:task_list' %}" class="logo-link">
                    TaskFlow
                </a>
            </div>

            <nav class="sidebar-menu">

                <a href="#" class="active">
                    <i class="bi bi-grid"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#">
                    <i class="bi bi-list-task"></i>
                    <span>My Tasks</span>
                </a>

                <a href="#">
                    <i class="bi bi-calendar3"></i>
                    <span>Calendar</span>
                </a>

                <a href="#">
                    <i class="bi bi-bar-chart"></i>
                    <span>Analytics</span>
                </a>

                <a href="#">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>

            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="navbar-left">
                    <h4 class="page-title">
                        {% block page_title %}
                            Dashboard
                        {% endblock %}
                    </h4>
                </div>
                
                <div class="navbar-center">
                    <div class="top-search">
                        <i class="bi bi-search"></i>

                        <input
                            id="globalSearch"
                            type="text"
                            placeholder="Search tasks...">
                    </div>
                </div>

                <div class="navbar-right">
                    {% if show_add_button %}
                    <button
                        class="btn btn-accent"
                        data-bs-toggle="modal"
                        data-bs-target="#addTaskModal">
                        <i class="bi bi-plus-lg"></i>
                        Add Task
                    </button>
                    {% endif %}

                    <button class="icon-btn">
                        <i class="bi bi-bell"></i>
                    </button>
                    <div class="user-avatar">
                        S
                    </div>
                </div>
            

            </header>

            <div class="content-wrapper">

                {% block content %}
                {% endblock %}

            </div>

        </main>

    </div>

        <!-- Global Success Toast -->
        <div class="toast-container position-fixed bottom-0 end-0 p-4" style="z-index: 1080">

            <div id="successToast"
                 class="toast align-items-center text-white bg-success border-0"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true">

                <div class="d-flex">
                
                    <div class="toast-body">
                        Success
                    </div>

                    <button type="button"
                            class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast">
                    </button>

                </div>

            </div>

        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'todo/js/task_modal.js' %}"></script>  
</body>
</html>
